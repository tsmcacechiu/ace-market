[project]
name = "market"
version = "0.1.0"
description = "Market valuation dashboard backend"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.7",
    "fastapi>=0.115",
    "lxml>=5.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["market"]

[tool.pytest.ini_options]
testpaths = ["tests"]
