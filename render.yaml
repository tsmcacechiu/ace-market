# Render Blueprint: https://render.com/docs/blueprint-spec
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: market-api
    runtime: python
    region: singapore # same region as the Supabase database (ap-southeast-1)
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn market.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/metrics # does not touch the database
    autoDeploy: true # redeploy on every push to main
    envVars:
      - key: DATABASE_URL # Supabase session pooler URL, same as backend/.env
        sync: false
      - key: CORS_ORIGINS # frontend URL(s), comma-separated; fill in once the frontend is deployed
        sync: false
      - key: TZ # job timestamps are server-local; keep them in the same zone as existing rows
        value: Asia/Taipei
